openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /portal/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Demo session and available managers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
    post:
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
    delete:
      operationId: signOut
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /portal/resources:
    get:
      operationId: listResources
      responses:
        "200":
          description: Role-filtered resources; editors also see archived items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Resource" }
    post:
      operationId: saveResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceInput" }
      responses:
        "200":
          description: Created or updated resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
  /portal/employees:
    get:
      operationId: listEmployees
      responses:
        "200":
          description: Employees for registration
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
  /portal/registrations:
    post:
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationInput" }
      responses:
        "200":
          description: One-time code valid for fifteen minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registration" }
  /portal/resources/{id}/word-preview:
    get:
      operationId: getWordPreview
      summary: Read a Word document without downloading or sharing it externally
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sanitized Word content suitable for in-app reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WordPreview" }
  /portal/learning-views:
    post:
      operationId: recordLearningView
      summary: Record an authorized e-learning page open
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningViewInput" }
      responses:
        "200":
          description: Recorded; repeated event IDs do not increment the count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningViewReceipt" }
  /portal/viewing-report:
    get:
      operationId: getViewingReport
      summary: Manager-only e-learning viewing history
      parameters:
        - in: query
          name: userId
          schema: { type: string }
        - in: query
          name: resourceId
          schema: { type: string }
      responses:
        "200":
          description: Page opens grouped by person, module, and browser device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewingReport" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Direct upload destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
components:
  schemas:
    WordPreview:
      type: object
      required: [html, format]
      properties:
        html: { type: string }
        format: { type: string, enum: [docx, doc] }
    LearningViewInput:
      type: object
      required: [resourceId, eventId]
      properties:
        resourceId: { type: string, minLength: 1 }
        eventId: { type: string, format: uuid }
    LearningViewReceipt:
      type: object
      required: [id, openedAt]
      properties:
        id: { type: string }
        openedAt: { type: string }
    ViewingReport:
      type: object
      required: [records, people, modules]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/ViewingRecord" }
        people:
          type: array
          items: { $ref: "#/components/schemas/User" }
        modules:
          type: array
          items: { $ref: "#/components/schemas/ReportModule" }
    ReportModule:
      type: object
      required: [id, title, archived]
      properties:
        id: { type: string }
        title: { type: string }
        archived: { type: boolean }
    ViewingRecord:
      type: object
      required: [userId, name, employeeId, role, resourceId, title, deviceId, viewCount, firstViewedAt, lastViewedAt, archived]
      properties:
        userId: { type: string }
        name: { type: string }
        employeeId: { type: string }
        role: { type: string, enum: [Employee, Manager] }
        resourceId: { type: string }
        title: { type: string }
        deviceId: { type: string }
        viewCount: { type: integer }
        firstViewedAt: { type: string }
        lastViewedAt: { type: string }
        archived: { type: boolean }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    User:
      type: object
      required: [id, name, employeeId, area, role, jobLevel, editor]
      properties:
        id: { type: string }
        name: { type: string }
        employeeId: { type: string }
        area: { type: string }
        role: { type: string, enum: [Employee, Manager] }
        jobLevel: { $ref: "#/components/schemas/JobLevel" }
        editor: { type: boolean }
    JobLevel:
      type: string
      enum: [Frontline Employee, Lead, Supervisor, Manager]
    Session:
      type: object
      required: [user, managers]
      properties:
        user:
          anyOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        managers:
          type: array
          items: { $ref: "#/components/schemas/User" }
    SessionInput:
      type: object
      properties:
        userId: { type: string }
        code: { type: string }
    ResourceInput:
      type: object
      required: [kind, title, description, area, audience]
      properties:
        id: { type: string }
        kind: { type: string, enum: [sop, learning, toolkit] }
        title: { type: string, minLength: 1 }
        description: { type: string }
        area: { type: string, enum: [Receiving, Picking, Packing, Shipping, Inventory, Safety, Talent Management] }
        contentGroup: { type: string, maxLength: 120 }
        audience: { type: string, enum: [Employees, Managers, Both] }
        owner: { type: string }
        version: { type: string }
        effectiveDate: { type: string }
        lastReviewed: { type: string }
        fileUrl: { type: string }
        fileName: { type: string }
        shareUrl: { type: string }
        minutes: { type: integer, minimum: 1 }
        category: { type: string }
        archived: { type: boolean }
    Resource:
      allOf:
        - { $ref: "#/components/schemas/ResourceInput" }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: string }
            updatedAt: { type: string }
    RegistrationInput:
      type: object
      properties:
        employeeUserId: { type: string }
        name: { type: string }
        employeeId: { type: string }
        area: { type: string }
        jobLevel: { $ref: "#/components/schemas/JobLevel" }
    Registration:
      type: object
      required: [code, expiresAt, employee]
      properties:
        code: { type: string }
        expiresAt: { type: string }
        employee: { $ref: "#/components/schemas/User" }
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string }
        size: { type: integer, minimum: 1, maximum: 20971520 }
        contentType: { type: string }
    Upload:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
